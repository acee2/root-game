name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Installa XcodeGen
        run: brew install xcodegen
      - name: Genera progetto
        run: xcodegen generate
      - name: Compila
        run: |
          xcodebuild -project Root.xcodeproj -scheme Root -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Crea IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Root.app Payload/
          zip -qr Root.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Root-ipa
          path: Root.ipa
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Root build ${{ github.run_number }}
          files: Root.ipa
